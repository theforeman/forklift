---
- name: Install podman-docker
  package:
    name: podman-docker
    state: installed

- name: Create containers.conf.d directory
  file:
    path: /etc/containers/containers.conf.d
    state: directory
    mode: "0755"
  when: ansible_facts['distribution_major_version'] == "10"

- name: Align podman's default network name with its reported NetworkMode
  copy:
    dest: /etc/containers/containers.conf.d/99-default-network.conf
    content: |
      [network]
      default_network = "bridge"
    mode: "0644"
  when: ansible_facts['distribution_major_version'] == "10"

- name: Start podman
  service:
    name: podman
    state: started

- name: Install git
  package:
    name: git
    state: installed

- name: Enable ruby 2.7 module
  command: dnf module enable -y ruby:2.7
  when: ansible_facts['distribution_major_version'] == "8"

- name: Enable ruby 3.3 module
  command: dnf module enable -y ruby:3.3
  when: ansible_facts['distribution_major_version'] == "9"

- name: enable powertools
  command: dnf config-manager --set-enabled powertools
  when: ansible_facts['distribution_major_version'] == "8"

- name: enable CRB
  command: dnf config-manager --set-enabled crb
  when: ansible_facts['distribution_major_version'] in ["9", "10"]

- name: Install Ruby
  package:
    state: installed
    name:
      - ruby
      - ruby-devel
      - rubygem-bundler
      - gcc-c++
      - make
      - redhat-rpm-config
      - libffi-devel
      - libyaml-devel
      - openssl-devel

- name: Clone puppet module
  ansible.builtin.git:
    repo: "https://github.com/theforeman/{{ beaker_puppet_module }}.git"
    dest: "{{ beaker_puppet_module_path }}"
    version: "{{ beaker_puppet_module_version | default(omit) }}"

- name: Bundle install
  command: bundle install
  args:
    chdir: "{{ beaker_puppet_module_path }}"
