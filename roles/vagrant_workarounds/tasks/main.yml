---
- name: make grub not care that it can't be installed
  debconf:
    name: grub-pc
    question: grub-pc/install_devices_empty
    value: 'true'
    vtype: boolean
  when:
    - ansible_facts['os_family'] == 'Debian'

# workaround for https://github.com/lavabit/robox/issues/294
- name: clean up old Ubuntu initrds
  shell: rm -f /boot/*-generic.img
  when:
    - ansible_facts['os_family'] == 'Debian'

# workaround for https://redhat.atlassian.net/browse/RHEL-236545
- name: force downgrade to selinux-policy-38.1.83-1.el9
  ansible.builtin.dnf:
    name:
      - selinux-policy-38.1.83-1.el9
      - selinux-policy-targeted-38.1.83-1.el9
    state: present
    allow_downgrade: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_major_version'] == '9'
    - ansible_facts['distribution'] == 'CentOS'

- name: don't install broken selinux-policy on EL9
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: excludepkgs
    value: 'selinux-policy-38.1.84-1.*,selinux-policy-targeted-38.1.84-1.*'
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_major_version'] == '9'
    - ansible_facts['distribution'] == 'CentOS'

# workaround for mirrors.edge.kernel.org being unroutable from some CI networks,
# it is the default mirror in /etc/apt/sources.list of the generic/ubuntu* boxes
- name: find apt sources using mirrors.edge.kernel.org
  ansible.builtin.find:
    paths:
      - /etc/apt
      - /etc/apt/sources.list.d
    patterns: 'sources.list,*.list,*.sources'
    contains: 'mirrors\.edge\.kernel\.org'
  register: kernel_mirror_apt_sources
  when:
    - ansible_facts['distribution'] == 'Ubuntu'

- name: point apt at archive.ubuntu.com
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: 'https?://mirrors\.edge\.kernel\.org/ubuntu'
    replace: 'http://archive.ubuntu.com/ubuntu'
  loop: "{{ kernel_mirror_apt_sources.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
